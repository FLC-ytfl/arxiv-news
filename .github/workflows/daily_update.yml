name: Daily ArXiv Update

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 运行 (北京时间 8:00)
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py

      - name: Archive previous README
        run: |
          if [ -f README.md ]; then
            # 获取前一天的日期
            PREV_DATE=$(date -d "yesterday" +'%Y.%m.%d')
            YEAR=$(date -d "yesterday" +'%Y')
            MONTH=$(date -d "yesterday" +'%m')
            
            # 创建 history 目录结构
            mkdir -p "history/${YEAR}/${MONTH}"
            
            # 复制当前 README 到 history（使用前一天日期命名）
            cp README.md "history/${YEAR}/${MONTH}/${PREV_DATE}.md"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md history/ docs/
          git commit -m "Auto update ArXiv news: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
